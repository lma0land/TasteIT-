[project]
name = "tasteit-backend"
version = "0.1.0"
description = "Python backend for the TasteIT intelligent learning platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.9",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2.1",
  "email-validator>=2.2,<3.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
  "httpx>=0.27,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
